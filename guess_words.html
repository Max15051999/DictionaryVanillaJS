<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/guess_words.css">
    <title></title>
</head>
<body>
    <div class="header">
        <input id="white" type="radio" value="white" name="theme" onclick="changeTheme('white');">
        <label for="white">Светлая</label>
        <input id="black" type="radio" value="black" name="theme" onclick="changeTheme('black');" checked>
        <label for="black">Тёмная</label><br>
        <a style="color: red;" href="index.html">В начало</a>
    </div>

    <br><br>

    <div class="container" style="display: block;">
        <h1></h1>

        <hr><br><br><br>

        <input id="total-words-input" type="number" min="1" oninput="onChangeTotalWords(this);">
        <input id="take-from-end-checkbox" type="checkbox">
        <label for="take-from-end-checkbox" style="cursor: pointer;">Брать с конца</label>
        <br><br>

        <input type="radio" id="foreign-rus" name="primary-lang" checked>
        <label id="foreign-rus-label" for="foreign-rus"></label><br>
        <input type="radio" id="rus-foreign" name="primary-lang">
        <label id="rus-foreign-label" for="rus-foreign"></label>
        <br><br><br>

        <input type="radio" id="word-cards" name="choose-type">
        <label for="word-cards">Карточки</label>
        <input type="radio" id="word-text" name="choose-type" checked>
        <label for="word-text">Текст</label>
        <br><br><br>

        <button id="chose-words" onclick="showCustomAlert();">Выбрать слова</button>

        <br><br><br><br><br><br>
        <a href="words_game.html"><button onclick="startGame();">Начать игру</button></a><br><br>
        <a href="my_dictionaries.html"><button onclick="sessionStorage.setItem('dictPage', 'guess_back')">Назад</button></a>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title" id="modalTitle">Выбор слов для игры - <label id="custom-words-total-chose"></label></div>
            <div class="modal-content" id="modalContent" onclick="customWordClick(event);">

            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeModal(false);">Cancel</button>
                <button class="btn-primary" onclick="confirmModal();">OK</button>
            </div>
        </div>
    </div>

    <script src="js/consts.js"></script>
    <script src="js/token.js"></script>
    <script src="js/guess_words.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
